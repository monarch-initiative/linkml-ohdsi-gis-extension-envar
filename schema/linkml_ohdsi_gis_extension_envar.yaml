classes:
  Geometry:
    name: Geometry
    definition_uri: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar/Geometry
    description: Geometry is an abstract type. Geometry values belong to one of its
      concrete subtypes which represent various kinds and dimensions of geometric
      shapes.
    from_schema: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar
    class_uri: linkml_ohdsi_gis_extension_envar:Geometry
  Point:
    name: Point
    definition_uri: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar/Point
    description: A Point is a 0-dimensional geometry that represents a single location
      in coordinate space.
    from_schema: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar
    is_a: Geometry
    class_uri: linkml_ohdsi_gis_extension_envar:Point
  LineString:
    name: LineString
    definition_uri: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar/LineString
    description: A LineString is a 1-dimensional line formed by a contiguous sequence
      of line segments. Each line segment is defined by two points, with the end point
      of one segment forming the start point of the next segment. An OGC-valid LineString
      has either zero or two or more points, but PostGIS also allows single-point
      LineStrings. LineStrings may cross themselves (self-intersect). A LineString
      is closed if the start and end points are the same. A LineString is simple if
      it does not self-intersect.
    from_schema: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar
    is_a: Geometry
    class_uri: linkml_ohdsi_gis_extension_envar:LineString
  LinearRing:
    name: LinearRing
    definition_uri: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar/LinearRing
    description: A LinearRing is a LineString which is both closed and simple. The
      first and last points must be equal, and the line must not self-intersect.
    from_schema: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar
    is_a: Geometry
    class_uri: linkml_ohdsi_gis_extension_envar:LinearRing
  Polygon:
    name: Polygon
    definition_uri: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar/Polygon
    description: A Polygon is a 2-dimensional planar region, delimited by an exterior
      boundary (the shell) and zero or more interior boundaries (holes). Each boundary
      is a LinearRing.
    from_schema: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar
    is_a: Geometry
    class_uri: linkml_ohdsi_gis_extension_envar:Polygon
  MultiPoint:
    name: MultiPoint
    definition_uri: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar/MultiPoint
    description: A MultiPoint is a collection of Points.
    from_schema: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar
    is_a: Geometry
    class_uri: linkml_ohdsi_gis_extension_envar:MultiPoint
  MultiLineString:
    name: MultiLineString
    definition_uri: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar/MultiLineString
    description: A MultiLineString is a collection of LineStrings. A MultiLineString
      is closed if each of its elements is closed.
    from_schema: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar
    is_a: Geometry
    class_uri: linkml_ohdsi_gis_extension_envar:MultiLineString
  MultiPolygon:
    name: MultiPolygon
    definition_uri: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar/MultiPolygon
    description: A MultiPolygon is a collection of non-overlapping, non-adjacent Polygons.
      Polygons in the collection may touch only at a finite number of points.
    from_schema: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar
    is_a: Geometry
    class_uri: linkml_ohdsi_gis_extension_envar:MultiPolygon
  GeometryCollection:
    name: GeometryCollection
    definition_uri: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar/GeometryCollection
    description: A GeometryCollection is a heterogeneous (mixed) collection of geometries.
    from_schema: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar
    is_a: Geometry
    class_uri: linkml_ohdsi_gis_extension_envar:GeometryCollection
  PolyhedralSurface:
    name: PolyhedralSurface
    definition_uri: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar/PolyhedralSurface
    description: A PolyhedralSurface is a contiguous collection of patches or facets
      which share some edges. Each patch is a planar Polygon. If the Polygon coordinates
      have Z ordinates then the surface is 3-dimensional.
    from_schema: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar
    is_a: Geometry
    class_uri: linkml_ohdsi_gis_extension_envar:PolyhedralSurface
  Triangle:
    name: Triangle
    definition_uri: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar/Triangle
    description: A Triangle is a polygon defined by three distinct non-collinear vertices.
      Because a Triangle is a polygon it is specified by four coordinates, with the
      first and fourth being equal.
    from_schema: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar
    is_a: Geometry
    class_uri: linkml_ohdsi_gis_extension_envar:Triangle
  TIN:
    name: TIN
    definition_uri: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar/TIN
    description: A TIN is a collection of non-overlapping Triangles representing a
      Triangulated Irregular Network.
