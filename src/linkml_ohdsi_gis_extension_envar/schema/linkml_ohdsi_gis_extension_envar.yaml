#────────────────────────────────────────────────────────────────
# SLOTS
#────────────────────────────────────────────────────────────────

slots:
  # External Exposure table slots
  external_exposure_id:
    # identifier: true
    range: integer
  location_id:
    # identifier: true
    range: integer
  person_id:
    # identifier: true
    range: integer
  exposure_concept_id:
    # identifier: true
    range: integer
  exposure_start_date:
    range: date
  exposure_start_datetime:
    range: datetime
  exposure_end_date:
    range: date
  exposure_end_datetime:
    range: datetime
  exposure_type_concept_id:
    # identifier: true
    range: integer
  exposure_relationship_concept_id:
    # identifier: true
    range: integer
  exposure_source_concept_id:
    # identifier: true
    range: integer
  exposure_source_value:
    range: string
  exposure_relationship_source_value:
    range: string
  dose_unit_source_value:
    range: string
  quantity:
    range: float
  modifier_source_value:
    range: string
  operator_concept_id:
    # identifier: true
    range: integer
  value_as_number:
    range: float
  value_as_concept_id:
    # identifier: true
    range: integer
  unit_concept_id:
    # identifier: true
    range: integer

  # location history slots
  # location_id
  relationship_type_concept_id:
    # identifier: true
    range: integer
  domain_id:
    # identifier: true
    range: string  # GIS documentation says integer, which diverges from OMOP CDM 6
    pattern: "^.{0,20}$" # 20 character limit
  entity_id:
    # identifier: true
    range: integer
  start_date:
    range: date
  end_date:
    range: date

  # Location slots
  address_1:
    range: string
    pattern: "^.{0,50}$" # 50 character limit
  address_2:
    range: string
    pattern: "^.{0,50}$" # 50 character limit
  city:
    range: string
    pattern: "^.{0,50}$" # 50 character limit
  state:
    range: string
    pattern: "^.{0,2}$" # two character limit
  zip:
    range: string
    pattern: "^.{3,9}$" # zips can be 3-digit abbreviations, 5 digits, or 9 digits (ZIP+4)
  county:
    range: string
    pattern: "^.{0,20}$" # 20 character limit
  location_source_value:
    range: string
    pattern: "^.{0,50}$" # 50 character limit
  country_concept_id:
    # identifier: true
    range: integer
  country_source_value:
    range: string
  latitude:
    range: float
    minimum_value: -90
    maximum_value: 90
  longitude:
    range: float
    minimum_value: -180
    maximum_value: 180

  # Person table slots
  gender_concept_id:
    # identifier: true
    range: GenderConceptID
    # range: integer  # Swapping with enum
  year_of_birth:
    range: integer
  month_of_birth:
    range: integer
  day_of_birth:
    range: integer
  birth_datetime:
    range: datetime
  race_concept_id:
    # identifier: true
    range: integer
  ethnicity_concept_id:
    # identifier: true
    range: integer
  provider_id:
    # identifier: true
    range: integer
  care_site_id:
    # identifier: true
    range: integer
  person_source_value:
    range: string
    pattern: "^.{0,50}$" # 50 character limit
  gender_source_value:
    range: string
    pattern: "^.{0,50}$" # 50 character limit
  gender_source_concept_id:
    # identifier: true
    range: integer
  race_source_value:
    range: string
    pattern: "^.{0,50}$" # 50 character limit
  race_source_concept_id:
    # identifier: true
    range: integer
  ethnicity_source_value:
    range: string
    pattern: "^.{0,50}$" # 50 character limit
  ethnicity_source_concept_id:
    # identifier: true
    range: integer

  # Concept slots
  concept_id:
    # identifier: true
    range: integer
  concept_name:
    range: string
    pattern: "^.{0,255}$" # 255 character limit
  vocabulary_id:
    # identifier: true
    range: string
    pattern: "^.{0,20}$" # 20 character limit
  concept_class_id:
    # identifier: true
    range: string
    pattern: "^.{0,20}$" # 20 character limit
  standard_concept:
    range: string
    pattern: "^.$"  # Limit to one character
  concept_code:
    range: string
    pattern: "^.{0,50}$" # 50 character limit
  valid_start_date:
    range: date
  valid_end_date:
    range: date
  invalid_reason:
    range: string
    pattern: "^.$"  # Limit to one character

  # GeomTemplate slots
  geom_record_id:
    # identifier: true
    range: integer
  geom_name:
    range: string
  geom_source_coding:
    range: string
  geom_source_value:
    range: string
  geom_wgs84:
    range: Geometry
  geom_local_epsg:
    range: integer
  geom_local_value:
    range: Geometry

  # AttrTemplate slots
  attr_record_id:
    # identifier: true
    range: integer  # postgresql type: serial
  # geom_record_id:
  variable_source_record_id:
    # identifier: true
    range: integer
  attr_concept_id:
    # identifier: true
    range: integer
  attr_start_date:
    range: date
  attr_end_date:
    range: date
  # value_as_number:
  value_as_string:
    range: string
  # value_as_concept_id:
  # unit_concept_id:
  unit_source_value:
    range: string
  qualifier_concept_id:
    # identifier: true
    range: integer
  qualifier_source_value:
    range: string
  attr_source_concept_id:
    # identifier: true
    range: integer
  attr_source_value:
    range: string
  value_source_value:
    range: string

  # AttrIndex slots
  attr_index_id:
    # identifier: true
    range: float  # postgresql type: numeric
  attr_of_geom_index_id:
    # identifier: true
    range: float  # postgresql type: numeric
  database_schema:
    range: string
    pattern: "^.{0,255}$" # 255 character limit
  table_name:
    range: string
    pattern: "^.{0,255}$" # 255 character limit
  data_source_id:
    # identifier: true
    range: float  # postgresql type: numeric


  # GeomIndex slots:
  geom_index_id:
    # identifier: true
    range: float  # postgresql type: numeric
  data_type_id:
    # identifier: true
    range: float  # postgresql type: numeric
  data_type_name:
    range: string
    pattern: "^.{0,255}$" # 255 character limit
  geom_type_concept_id:
    # identifier: true
    range: float  # postgresql type: numeric
  geom_type_source_value:
    range: string
    pattern: "^.{0,255}$" # 255 character limit
  # database_schema:
  # table_name:
  table_desc:
    range: string
    pattern: "^.{0,255}$" # 255 character limit
  # data_source_id:

  # VariableSource slots:
  variable_source_id:
    # identifier: true
    range: integer
  geom_dependency_uuid:
    # identifier: true
    range: integer
  variable_name:
    range: string
  variable_desc:
    range: string
  data_source_uuid:
    # identifier: true
    range: integer
  attr_spec:
    range: string

  # DataSource slots:
  org_id:
    # identifier: true
    range: string
    pattern: "^.{0,100}$" # 100 character limit
  org_set_id:
    # identifier: true
    range: string
    pattern: "^.{0,100}$" # 100 character limit
  dataset_name:
    range: string
    pattern: "^.{0,100}$" # 100 character limit
  dataset_version:
    range: string
    pattern: "^.{0,100}$" # 100 character limit
  geom_type:
    range: string
    pattern: "^.{0,100}$" # 100 character limit
  geom_spec:
    range: string  # Note that the postgres format is listed as text, without character limit
  boundary_type:
    range: string
    pattern: "^.{0,100}$" # 100 character limit
  has_attributes:
    range: integer
  download_method:
    range: string
    pattern: "^.{0,100}$" # 100 character limit
  download_subtype:
    range: string
    pattern: "^.{0,100}$" # 100 character limit
  download_data_standard:
    range: string
    pattern: "^.{0,100}$" # 100 character limit
  download_filename:
    range: string
    pattern: "^.{0,100}$" # 100 character limit
  download_url:
    range: string
    pattern: "^.{0,255}$" # 255 character limit
  download_auth:
    range: string
    pattern: "^.{0,100}$" # 100 character limit
  documentation_url:
    range: string
    pattern: "^.{0,255}$" # 255 character limit

  # LocationMap slots:
  address_point:


#────────────────────────────────────────────────────────────────
# ENUMS
#────────────────────────────────────────────────────────────────
# Possible enums
# Gender: https://athena.ohdsi.org/search-terms/terms?domain=Gender&standardConcept=Standard&page=1&pageSize=15&query=  (2 concepts)
# Race: https://athena.ohdsi.org/search-terms/terms?domain=Race&standardConcept=Standard&page=1&pageSize=500&query= (1406 concepts)
# Ethnicity: https://athena.ohdsi.org/search-terms/terms?domain=Ethnicity&standardConcept=Standard&page=1&pageSize=500&query= (150 concepts)
# Is there way to specify domain of a concept? If so, could indicate that the race concept ID must have a Race domain ID.
# It would require a means of looking up the domain of a concept when used in another table, like Race/Ethnicity in the Person table.

enums:
  GenderConceptID:
    permissible_values:
      8532: # OMOP Concept ID, it does result in a warning for having a numeric name.
        description: F, Female
        meaning: PATO:0000383 # female
      8507: # OMOP Concept ID, it does result in a warning for having a numeric name.
        description: M, Male
        meaning: PATO:0000384 # male

