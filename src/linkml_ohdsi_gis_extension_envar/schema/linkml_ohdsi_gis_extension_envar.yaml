classes:

  #Geometry class to be used as range
  Geometry:
    # Geometry types per https://postgis.net/docs/using_postgis_dbmanagement.html#OGC_Geometry
    # uri: xsd:string
    # base: str
    description: Geometry is an abstract type. Geometry values belong to one of its concrete subtypes which represent various kinds and dimensions of geometric shapes.
    # range: string
  Point:
    is_a: Geometry
    description: A Point is a 0-dimensional geometry that represents a single location in coordinate space.
    # range: string
  LineString:
    is_a: Geometry
    description: A LineString is a 1-dimensional line formed by a contiguous sequence of line segments. Each line segment is defined by two points, with the end point of one segment forming the start point of the next segment. An OGC-valid LineString has either zero or two or more points, but PostGIS also allows single-point LineStrings. LineStrings may cross themselves (self-intersect). A LineString is closed if the start and end points are the same. A LineString is simple if it does not self-intersect.
    # range: string
  LinearRing:
    is_a: Geometry
    description: A LinearRing is a LineString which is both closed and simple. The first and last points must be equal, and the line must not self-intersect.
    # range: string
  Polygon:
    is_a: Geometry
    description: A Polygon is a 2-dimensional planar region, delimited by an exterior boundary (the shell) and zero or more interior boundaries (holes). Each boundary is a LinearRing.
    # range: string
  MultiPoint:
    is_a: Geometry
    description: A MultiPoint is a collection of Points.
    # range: string
  MultiLineString:
    is_a: Geometry
    description: A MultiLineString is a collection of LineStrings. A MultiLineString is closed if each of its elements is closed.
    # range: string
  MultiPolygon:
    is_a: Geometry
    description: A MultiPolygon is a collection of non-overlapping, non-adjacent Polygons. Polygons in the collection may touch only at a finite number of points.
    # range: string
  GeometryCollection:
    is_a: Geometry
    description: A GeometryCollection is a heterogeneous (mixed) collection of geometries.
    # range: string
  PolyhedralSurface:
    is_a: Geometry
    description: A PolyhedralSurface is a contiguous collection of patches or facets which share some edges. Each patch is a planar Polygon. If the Polygon coordinates have Z ordinates then the surface is 3-dimensional.
    # range: string
  Triangle:
    is_a: Geometry
    description: A Triangle is a polygon defined by three distinct non-collinear vertices. Because a Triangle is a polygon it is specified by four coordinates, with the first and fourth being equal.
    # range: string
  TIN:  # (riangulated Irregular Network
    is_a: Geometry
    description: A TIN is a collection of non-overlapping Triangles representing a Triangulated Irregular Network.
    # range: string



#────────────────────────────────────────────────────────────────
# GIS Extension OMOP Tables
#────────────────────────────────────────────────────────────────

  ExternalExposure:
    description: >-
      A foundational class for integration of spatial, environmental, and sociodemographic data into observational health research workflows.
    slots:
      - external_exposure_id
      - location_id
      - person_id
      - exposure_concept_id
      - exposure_start_date
      - exposure_start_datetime
      - exposure_end_date
      - exposure_end_datetime
      - exposure_type_concept_id
      - exposure_relationship_concept_id
      - exposure_source_concept_id
      - exposure_source_value
      - exposure_relationship_source_value
      - dose_unit_source_value
      - quantity
      - modifier_source_value
      - operator_concept_id
      - value_as_number
      - value_as_concept_id
      - unit_concept_id
    slot_usage:
      external_exposure_id:
        key: true
        # identifier: true
        # required: true # not needed if identifier as automatically required
      location_id:
        required: true
      person_id:
        required: true
      exposure_concept_id:
        required: true
      exposure_start_date:
        required: true
      exposure_end_date:
        required: true
      exposure_type_concept_id:
        required: true
      exposure_relationship_concept_id:
        required: true

  LocationHistory:
    description: >-
      A class for storing location history.
    slots:
      - location_id
      - relationship_type_concept_id
      - domain_id
      - entity_id
      - start_date
      - end_date
    slot_usage:
      location_id:  #
        # key: true
        required: true
        # identifier: true
      relationship_type_concept_id:
        required: true
      domain_id:
        required: true
      entity_id:
        required: true
      start_date:
        required: true

  LocationMap: #TODO: is there a full schema available somewhere for LocationMap? I have yet to find anything beyond what's in the schema overview diagram that only displays two fields.
    description: >-
      A class representing the locations mapped to address points.
    slots:
      - location_id
      - address_point
    slot_usage:
      location_id:
        key: true
        required: true

