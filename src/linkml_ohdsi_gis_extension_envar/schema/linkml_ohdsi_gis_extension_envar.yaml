---
id: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar
name: linkml-ohdsi-gis-extension-envar
title: linkml-ohdsi-gis-extension-envar
description: |-
  A LinkML model of the OHDSI GIS extension
license: Apache-2.0
see_also:
  - https://monarch-initiative.github.io/linkml-ohdsi-gis-extension-envar

prefixes:
  linkml_ohdsi_gis_extension_envar: https://w3id.org/monarch-initiative/linkml-ohdsi-gis-extension-envar/
  linkml: https://w3id.org/linkml/
  biolink: https://w3id.org/biolink/vocab/
  schema: http://schema.org/
  PATO: http://purl.obolibrary.org/obo/PATO_
  example: http://www.example.org/rdf#
default_prefix: linkml_ohdsi_gis_extension_envar
default_range: string

imports:
  - linkml:types

classes:

#────────────────────────────────────────────────────────────────
# GIS Extension OMOP Tables
#────────────────────────────────────────────────────────────────

  ExternalExposure:
    description: >-
      A foundational class for integration of spatial, environmental, and sociodemographic data into observational health research workflows.
    slots:
      - external_exposure_id
      - location_id
      - person_id
      - exposure_concept_id
      - exposure_start_date
      - exposure_start_datetime
      - exposure_end_date
      - exposure_end_datetime
      - exposure_type_concept_id
      - exposure_relationship_concept_id
      - exposure_source_concept_id
      - exposure_source_value
      - exposure_relationship_source_value
      - dose_unit_source_value
      - quantity
      - modifier_source_value
      - operator_concept_id
      - value_as_number
      - value_as_concept_id
      - unit_concept_id
    class_uri: schema:Thing

  LocationHistory:
    description: >-
      A class for storing location history.
    slots:
      - location_id
      - relationship_type_concept_id
      - domain_id
      - entity_id
      - start_date
      - end_date

  LocationMap:
    description: >-
      A class representing the location
    slots:
      - location_id
      - relationship_type_concept_id
#────────────────────────────────────────────────────────────────
# GIS Source Template Tables -> https://ohdsi.github.io/GIS/gaia-principles.html
# Are these needed? They are templates, but may differ in actual implementation,
# and could have diffrerent/additional variables.
#────────────────────────────────────────────────────────────────

  GeomTemplate:
    description: >-
      A class representing...
    slots:
      - geom_record_id
      - geom_source_coding
      - geom_source_value
      - geom_wgs84
      - geom_local_epsg
      - geom_local_value

  AttrTemplate:
    description: >-
      A class representing...
    slots:
      - attr_record_id
      - geom_record_id
      - variable_source_record_id
      - attr_concept_id
      - attr_start_date
      - attr_end_date
      - value_as_number
      - value_as_string
      - value_as_concept_id
      - unit_concept_id
      - unit_source_value
      - qualifier_concept_id
      - qualifier_source_value
      - attr_source_concept_id
      - attr_source_value
      - value_source_value

  AttrIndex:
    description: >-
      A class representing...
    slots:
      - attr_index_id
      - attr_of_geom_index_id
      - database_schema
      - table_name
      - data_source_id


  GeomIndex:
    description: >-
      A class representing the location
    slots:
      - geom_index_id
      - data_type_id
      - data_type_name
      - geom_type_concept_id
      - geom_type_source_value
      - database_schema
      - table_name
      - table_desc
      - data_source_id


  VariableSource:
    description: >-
      A class representing the location
    slots:
      - variable_source_id
      - variable_name
      - variable_desc
      - data_source_uuid
      - attr_spec

#────────────────────────────────────────────────────────────────
# Standard OMOP Tables
#────────────────────────────────────────────────────────────────

  Location:
    description: >-
      A class representing a physical location
    slots:
      - location_id
      - address_1
      - address_2
      - city
      - state
      - zip
      - county
      - location_source_value
      # Note the fields below are extensions of the standard Location table
      - country_concept_id
      - country_source_value
      - latitude
      - longitude

  Person:
    description: >-
      A class representing a person
    slots:
      - person_id
      - gender_concept_id
      - year_of_birth
      - month_of_birth
      - day_of_birth
      - birth_datetime
      - race_concept_id
      - ethnicity_concept_id
      - location_id
      - provider_id
      - care_site_id
      - person_source_value
      - gender_source_value
      - gender_source_concept_id
      - race_source_value
      - race_source_concept_id
      - ethnicity_source_value
      - ethnicity_source_concept_id

  Concept:
    description: >-
      A class representing an OMOP concept
    slots:
      - concept_id
      - concept_name
      - domain_id
      - vocabulary_id
      - concept_class_id
      - standard_concept
      - concept_code
      - valid_start_date
      - valid_end_date
      - invalid_reason

#────────────────────────────────────────────────────────────────
# SLOTS
#────────────────────────────────────────────────────────────────

slots:
  # External Exposure table slots
  external_exposure_id:
    identifier: true
    range: integer
    required: true
  location_id:
    identifier: true
    range: integer
  person_id:
    identifier: true
    range: integer
  exposure_concept_id:
    identifier: true
    range: integer
  exposure_start_date:
    range: date
  exposure_start_datetime:
    range: datetime
  exposure_end_date:
    range: date
  exposure_end_datetime:
    range: datetime
  exposure_type_concept_id:
    identifier: true
    range: integer
  exposure_relationship_concept_id:
    identifier: true
    range: integer
  exposure_source_concept_id:
    identifier: true
    range: integer
  exposure_source_value:
    range: string
  exposure_relationship_source_value:
    range: string
  dose_unit_source_value:
    range: string
  quantity:
    range: float
  modifier_source_value:
    range: string
  operator_concept_id:
    identifier: true
    range: integer
  value_as_number:
    range: float
  value_as_concept_id:
    identifier: true
    range: integer
  unit_concept_id:
    identifier: true
    range: integer

  # location history slots
  relationship_type_concept_id:
    identifier: true
    range: integer
  domain_id:
    identifier: true
    range: string  # GIS documentation says integer
    pattern: "^.{0,20}$" # 20 character limit
  entity_id:
    identifier: true
    range: integer
  start_date:
    range: date
  end_date:
    range: date

  # Location slots
  address_1:
    range: string
    pattern: "^.{0,50}$" # 50 character limit
  address_2:
    range: string
    pattern: "^.{0,50}$" # 50 character limit
  city:
    range: string
    pattern: "^.{0,50}$" # 50 character limit
  state:
    range: string
    pattern: "^.{0,2}$" # two character limit
  zip:
    range: string
    pattern: "^.{3,9}$" # zips can be 3-digit abbreviations, 5 digits, or 9 digits (ZIP+4)
  county:
    range: string
    pattern: "^.{0,20}$" # 20 character limit
  location_source_value:
    range: string
    pattern: "^.{0,50}$" # 50 character limit
  country_concept_id:
    identifier: true
    range: integer
  country_source_value:
    range: string
  latitude:
    range: float
    minimum_value: -90
    maximum_value: 90
  longitude:
    range: float
    minimum_value: -180
    maximum_value: 180

  # Person table slots
  gender_concept_id:
    identifier: true
    range: integer
  year_of_birth:
    range: integer
  month_of_birth:
    range: integer
  day_of_birth:
    range: integer
  birth_datetime:
    range: datetime
  race_concept_id:
    identifier: true
    range: integer
  ethnicity_concept_id:
    identifier: true
    range: integer
  provider_id:
    identifier: true
    range: integer
  care_site_id:
    identifier: true
    range: integer
  person_source_value:
    range: string
    pattern: "^.{0,50}$" # 50 character limit
  gender_source_value:
    range: string
    pattern: "^.{0,50}$" # 50 character limit
  gender_source_concept_id:
    identifier: true
    range: integer
  race_source_value:
    range: string
    pattern: "^.{0,50}$" # 50 character limit
  race_source_concept_id:
    identifier: true
    range: integer
  ethnicity_source_value:
    range: string
    pattern: "^.{0,50}$" # 50 character limit
  ethnicity_source_concept_id:
    identifier: true
    range: integer

  # Concept slots
  concept_id:
    identifier: true
    range: integer
  concept_name:
    range: string
    pattern: "^.{0,255}$" # 255 character limit
  vocabulary_id:
    identifier: true
    range: string
    pattern: "^.{0,20}$" # 20 character limit
  concept_class_id:
    identifier: true
    range: string
    pattern: "^.{0,20}$" # 20 character limit
  standard_concept:
    range: string
    pattern: "^.$"  # Limit to one character
  concept_code:
    range: string
    pattern: "^.{0,50}$" # 50 character limit
  valid_start_date:
    range: date
  valid_end_date:
    range: date
  invalid_reason:
    range: string
    pattern: "^.$"  # Limit to one character


  # Template table slots - Needed?

  # GeomTemplate slots
  geom_record_id:
    identifier: true
  geom_source_coding:
  geom_source_value:
  geom_wgs84:
  geom_local_epsg:
  geom_local_value:

  # AttrTemplate slots
  attr_record_id:
    identifier: true
  # geom_record_id:
  variable_source_record_id:
    identifier: true
  attr_concept_id:
    identifier: true
  attr_start_date:
  attr_end_date:
  # value_as_number:
  value_as_string:
  # value_as_concept_id:
  # unit_concept_id:
  unit_source_value:
  qualifier_concept_id:
    identifier: true
  qualifier_source_value:
  attr_source_concept_id:
    identifier: true
  attr_source_value:
  value_source_value:

  # AttrIndex slots
  attr_index_id:
    identifier: true
  attr_of_geom_index_id:
    identifier: true
  database_schema:
  table_name:
  data_source_id:
    identifier: true


  # GeomIndex slots:
  geom_index_id:
    identifier: true
  data_type_id:
    identifier: true
  data_type_name:
  geom_type_concept_id:
    identifier: true
  geom_type_source_value:
  # database_schema:
  # table_name:
  table_desc:
  # data_source_id:

  # VariableSource slots:
  variable_source_id:
    identifier: true
  variable_name:
  variable_desc:
  data_source_uuid:
  attr_spec:





#────────────────────────────────────────────────────────────────
# ENUMS
#────────────────────────────────────────────────────────────────



