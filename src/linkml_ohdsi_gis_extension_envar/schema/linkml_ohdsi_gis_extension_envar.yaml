# and could have diffrerent/additional variables.
#────────────────────────────────────────────────────────────────

  GeomTemplate:
    description: >-
      A class representing a template for mapping geometries from a data source.
    slots:
      - geom_record_id
      - geom_name
      - geom_source_coding
      - geom_source_value
      - geom_wgs84
      - geom_local_epsg
      - geom_local_value
    slot_usage:
      geom_record_id:
        key: true
        required: true
      geom_name:
        required: true
      geom_source_coding:
        required: true
      geom_source_value:
        required: true
      geom_local_epsg:
        required: true
      geom_local_value:
        required: true

  AttrTemplate:
    description: >-
      A class representing a template for mapping attributes from a data source.
    slots:
      - attr_record_id
      - geom_record_id
      - variable_source_record_id
      - attr_concept_id
      - attr_start_date
      - attr_end_date
      - value_as_number
      - value_as_string
      - value_as_concept_id
      - unit_concept_id
      - unit_source_value
      - qualifier_concept_id
      - qualifier_source_value
      - attr_source_concept_id
      - attr_source_value
      - value_source_value
    slot_usage:
      attr_record_id:
        key: true
        required: true
      geom_record_id:
        required: true
      variable_source_record_id:
        required: true
      attr_start_date:
        required: true
      attr_end_date:
        required: true
      attr_source_value:
        required: true
      value_source_value:
        required: true

  AttrIndex:
    description: >-
      A class representing an index of attributes from a data source.
    slots:
      - attr_index_id
      - variable_source_id
      - attr_of_geom_index_id
      - database_schema
      - table_name
      - data_source_id
    slot_usage:
      attr_index_id:
        key: true
        required: true
      variable_source_id:
        required: true
      attr_of_geom_index_id:
        required: true
      database_schema:
        required: true
      table_name:
        required: true
      data_source_id:
        required: true

  GeomIndex:
    description: >-
      A class representing an index of geometries from a data source.
    slots:
      - geom_index_id
      - data_type_id
      - data_type_name
      - geom_type_concept_id
      - geom_type_source_value
      - database_schema
      - table_name
      - table_desc
      - data_source_id
    slot_usage:
      geom_index_id:
        key: true
        required: true
      data_type_name:
        required: true
      database_schema:
        required: true
      table_name:
        required: true
      table_desc:
        required: true
      data_source_id:
        required: true

  VariableSource:
    description: >-
      A class representing metadata about the variables in the data source.
    slots:
      - variable_source_id
      - geom_dependency_uuid
      - variable_name
      - variable_desc
      - data_source_uuid
      - attr_spec
    slot_usage:
      variable_source_id:
        key: true
        required: true
      variable_name:
        required: true
      variable_desc:
        required: true
      data_source_uuid:
        required: true
      attr_spec:
        required: true

  DataSource:
    description: >-
      A class representing metadata about the data source.
    slots:
      - data_source_uuid
      - org_id
      - org_set_id
      - dataset_name
      - dataset_version
      - geom_type
      - geom_spec
      - boundary_type
      - has_attributes
      - download_method
      - download_subtype
      - download_data_standard
      - download_filename
      - download_url
      - download_auth
      - documentation_url
    slot_usage:
      data_source_uuid:
        key: true
        required: true
      org_id:
        required: true
      org_set_id:
        required: true
      dataset_name:
        required: true
      dataset_version:
        required: true
      download_method:
        required: true
      download_subtype:
        required: true
      download_data_standard:
        required: true
      download_filename:
        required: true
      download_url:
        required: true


