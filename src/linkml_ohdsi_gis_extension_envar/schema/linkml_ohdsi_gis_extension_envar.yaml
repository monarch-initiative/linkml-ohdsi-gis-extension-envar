    identifier: true
  unit_concept_id:
    identifier: true
  relationship_type_concept_id:
    identifier: true
  domain_id:
    identifier: true
  entity_id:
    identifier: true
  start_date:
  end_date:
  address_1:
  address_2:
  city:
  state:
  zip:
  county:
  location_source_value:
  country_concept_id:
    identifier: true
  country_source_value:
