  race_concept_id:
    identifier: true
  ethnicity_concept_id:
    identifier: true
  provider_id:
    identifier: true
  care_site_id:
    identifier: true
  person_source_value:
  gender_source_value:
  gender_source_concept_id:
    identifier: true
  race_source_value:
  race_source_concept_id:
    identifier: true
  ethnicity_source_value:
  ethnicity_source_concept_id:
    identifier: true
  concept_id:
